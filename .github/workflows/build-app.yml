name: Build Modded Pocket

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aqw-mobile-mod
        uses: actions/checkout@v4
        with:
          path: aqw-mobile
          
      - name: Checkout aqw-api
        uses: actions/checkout@v4
        with:
          repository: JonasAlv/aqw-api
          path: aqw-api-enhanced

      - name: Setup Dlang
        uses: dlang-community/setup-dlang@v1

      - name: Install RABCDAsm & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git curl liblzma-dev default-jdk default-jre
          git clone --depth 1 https://github.com/CyberShadow/RABCDAsm.git
          cd RABCDAsm
          dmd -run build_rabcdasm.d
          sudo cp abcexport rabcdasm rabcasm abcreplace /usr/local/bin/

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Compile and Inject SWFs
        run: |
          cd aqw-mobile/loader
          
          echo "Compiling Mobile_code.swf"
          amxmlc +configname=air -define+=POCKET::IS_DESKTOP,false -define+=POCKET::IS_MOBILE,true -library-path+=libs -source-path+=src -source-path+=../../aqw-api-enhanced/src -output Mobile_code.swf src/Pocket.as
          abcexport Mobile_code.swf
          abcreplace Mobile.swf 0 Mobile_code-0.abc
          
          echo "Compiling WorkerMain.swf"
          mkdir -p gamefiles/embed
          amxmlc worker-src/WorkerMain.as -source-path+=src -source-path+=../../aqw-api-enhanced/src -source-path+=worker-src -output gamefiles/embed/WorkerMain.swf -swf-version=18
          
          echo "Compiling Desktop_code.swf"
          amxmlc +configname=air -define+=POCKET::IS_DESKTOP,true -define+=POCKET::IS_MOBILE,false -library-path+=libs -source-path+=worker-src -source-path+=src -source-path+=../../aqw-api-enhanced/src -output Desktop_code.swf src/Pocket.as
          abcexport Desktop_code.swf
          abcreplace Desktop.swf 0 Desktop_code-0.abc

      - name: Download Anthony's Precompiled gamefiles
        run: |
          cd aqw-mobile/loader
          mkdir -p gamefiles
          wget https://github.com/anthony-hyo/aqw-mobile/releases/download/v3.4.2/AQWPocket-v3.4.2-armv8.apk -O anthony.apk
          unzip -q anthony.apk "assets/gamefiles/*" -d extracted
          cp -r extracted/assets/gamefiles/* gamefiles/
          rm -rf anthony.apk extracted

      - name: Inject skills_custom.json
        run: |
          cd aqw-mobile/loader
          mkdir -p assets
          cp ../../aqw-api-enhanced/assets/skills_custom.json assets/skills.json

      - name: Generate Dynamic Keystore
        run: |
          cd aqw-mobile
          # Generate a 10-year validity pkcs12 and jks dynamically so we don't need github secrets
          keytool -genkey -v -keystore aqwpocket_keystore.jks -keyalg RSA -keysize 2048 -validity 3650 -alias cert -storepass password -keypass password -dname "CN=AQW, OU=Mobile, O=AQW, L=AQW, S=AQW, C=US"
          keytool -importkeystore -srckeystore aqwpocket_keystore.jks -srcstorepass password -destkeystore aqwpocket_keystore.p12 -deststoretype PKCS12 -deststorepass password

      - name: Upload patched workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-patched
          path: aqw-mobile/

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - architecture: "armv8"
            render-mode: "auto"
            suffix: ""
          - architecture: "armv8"
            render-mode: "direct"
            suffix: "-direct"
          - architecture: "armv8"
            render-mode: "gpu"
            suffix: "-gpu"
          - architecture: "armv7"
            render-mode: "auto"
            suffix: ""
          - architecture: "x86"
            render-mode: "auto"
            suffix: ""
          - architecture: "x64"
            render-mode: "auto"
            suffix: ""
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-patched
          path: .

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Build Android APK
        run: |
          sed -i "s|<renderMode>.*</renderMode>|<renderMode>${{ matrix.render-mode }}</renderMode>|" loader/Mobile-app.xml
          adt -package \
            -target apk-captive-runtime \
            -arch ${{ matrix.architecture }} \
            -storetype JKS \
            -keystore aqwpocket_keystore.jks \
            -storepass password \
            -keypass password \
            AQWPocket-Mod-${{ matrix.architecture }}${{ matrix.suffix }}.apk \
            loader/Mobile-app.xml \
            -C loader \
              Mobile.swf \
              assets \
              icons/icon-36x36.png \
              icons/icon-48x48.png \
              icons/icon-72x72.png \
              icons/icon-96x96.png \
              icons/icon-144x144.png \
              icons/icon-192x192.png \
              gamefiles/game.swf \
              gamefiles/world-map.swf \
              gamefiles/book-of-lore.swf \
              gamefiles/character-select.swf

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.architecture }}${{ matrix.suffix }}
          path: "*.apk"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - architecture: "x64"
            render-mode: "direct"
            suffix: "-windows-x64"
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-patched
          path: .

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Build Windows
        run: |
          (Get-Content loader/Desktop-app.xml) -replace '<renderMode>.*</renderMode>', '<renderMode>${{ matrix.render-mode }}</renderMode>' | Set-Content loader/Desktop-app.xml
          adt -package -storetype PKCS12 -keystore aqwpocket_keystore.p12 -storepass password -keypass password -target bundle -arch ${{ matrix.architecture }} AQWPocket-Mod${{ matrix.suffix }} loader/Desktop-app.xml -extdir loader/libs -C loader Desktop.swf assets icons/icon-16x16.png icons/icon-32x32.png icons/icon-36x36.png icons/icon-48x48.png icons/icon-72x72.png icons/icon-96x96.png icons/icon-128x128.png icons/icon-144x144.png icons/icon-192x192.png gamefiles/game.swf gamefiles/world-map.swf gamefiles/book-of-lore.swf gamefiles/character-select.swf

      - name: Zip
        run: Compress-Archive -Path "AQWPocket-Mod${{ matrix.suffix }}" -DestinationPath "AQWPocket-Mod${{ matrix.suffix }}.zip"

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: windows${{ matrix.suffix }}
          path: "*.zip"

  publish:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.4.2-mod"
          name: "AQW Mobile Mod v3.4.2"
          files: |
            *.apk
            *.zip
