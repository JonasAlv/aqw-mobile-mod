name: Build Modded Pocket

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Upstream release version to pull gamefiles from (e.g., v3.5.3)'
        required: true
        default: 'v3.5.3'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.date.outputs.BUILD_DATE }}
    permissions:
      contents: write
    steps:
      - name: Set Date
        id: date
        run: echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
      - name: Checkout aqw-mobile-mod
        uses: actions/checkout@v4
        with:
          path: aqw-mobile
          
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.6"

      - name: Install Haxe Dependencies
        run: |
          haxelib install hscript

      - name: Checkout Haxe API
        uses: actions/checkout@v4
        with:
          repository: JonasAlv/aqw-haxe-api
          ref: main
          path: aqw-haxe-api

      - name: Checkout Haxe UI
        uses: actions/checkout@v4
        with:
          repository: JonasAlv/aqw-haxe-ui
          ref: main
          path: aqw-haxe-ui

      - name: Build Haxe Libraries (AqwApi.swc & ModUI.swc)
        run: |
          mkdir -p aqw-mobile/loader/libs
          
          echo "=> Building aqw-haxe-api..."
          cd aqw-haxe-api
          haxe build.hxml
          cp bin/AqwApi.swc ../aqw-mobile/loader/libs/AqwApi.swc
          cd ..
          
          echo "=> Building aqw-haxe-ui..."
          cd aqw-haxe-ui
          haxe build.hxml
          cp bin/ModUI.swc ../aqw-mobile/loader/libs/ModUI.swc
          cd ..

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Dlang
        uses: dlang-community/setup-dlang@v2

      - name: Install RABCDAsm & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git curl liblzma-dev
          git clone --depth 1 https://github.com/CyberShadow/RABCDAsm.git
          cd RABCDAsm
          dmd -run build_rabcdasm.d
          sudo cp abcexport rabcdasm rabcasm abcreplace /usr/local/bin/

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Download Anthony's Precompiled gamefiles
        run: |
          cd aqw-mobile
          
          # Update app descriptor versions to match upstream version (strip leading v)
          RAW_VERSION="${{ inputs.upstream_version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          sed -i "s|<versionNumber>.*</versionNumber>|<versionNumber>${CLEAN_VERSION}</versionNumber>|" loader/Mobile-app.xml
          sed -i "s|<versionNumber>.*</versionNumber>|<versionNumber>${CLEAN_VERSION}</versionNumber>|" loader/Desktop-app.xml
          
          cd loader
          mkdir -p gamefiles
          wget https://github.com/anthony-hyo/aqw-mobile/releases/download/${{ inputs.upstream_version }}/AQWPocket-${{ inputs.upstream_version }}-armv8.apk -O anthony.apk
          unzip -q anthony.apk "assets/gamefiles/*" -d extracted
          cp -r extracted/assets/gamefiles/* gamefiles/
          rm -rf anthony.apk extracted

      - name: Compile and Inject SWFs
        run: |
          cd aqw-mobile/loader
          
          echo "Compiling WorkerMain.swf"
          mkdir -p gamefiles/embed
          amxmlc worker-src/WorkerMain.as -source-path+=src -source-path+=worker-src -output gamefiles/embed/WorkerMain.swf -swf-version=18
          
          echo "Compiling Mobile_code.swf"
          amxmlc +configname=air -define+=POCKET::IS_DESKTOP,false -define+=POCKET::IS_MOBILE,true -library-path+=libs -source-path+=worker-src -source-path+=src -output Mobile_code.swf src/Pocket.as
          abcexport Mobile_code.swf
          abcreplace Mobile.swf 0 Mobile_code-0.abc
          
          echo "Compiling Desktop_code.swf"
          amxmlc +configname=air -define+=POCKET::IS_DESKTOP,true -define+=POCKET::IS_MOBILE,false -library-path+=libs -source-path+=worker-src -source-path+=src -output Desktop_code.swf src/Pocket.as
          abcexport Desktop_code.swf
          abcreplace Desktop.swf 0 Desktop_code-0.abc

      - name: Verify Assets and Workspace
        run: |
          echo "=> Verifying bundled assets..."
          ls -lh aqw-mobile/loader/assets/
          test -f aqw-mobile/loader/assets/AdvancedSkills.json || (echo "ERROR: AdvancedSkills.json is missing!" && exit 1)
          test -f aqw-mobile/loader/assets/QuestData.json || (echo "ERROR: QuestData.json is missing!" && exit 1)
          echo "=> Assets verified successfully."



      - name: Upload patched workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-patched
          path: aqw-mobile/

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - architecture: "armv8"
            render-mode: "auto"
            suffix: ""
          - architecture: "armv8"
            render-mode: "direct"
            suffix: "-direct"
          - architecture: "armv8"
            render-mode: "gpu"
            suffix: "-gpu"
          - architecture: "armv7"
            render-mode: "auto"
            suffix: ""
          - architecture: "armv7"
            render-mode: "direct"
            suffix: "-direct"
          - architecture: "armv7"
            render-mode: "gpu"
            suffix: "-gpu"
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-patched
          path: .

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Build Android APK
        run: |
          adt -certificate -cn "AQWPocket" 2048-RSA aqwpocket_keystore.p12 password
          sed -i "s|<renderMode>.*</renderMode>|<renderMode>${{ matrix.render-mode }}</renderMode>|" loader/Mobile-app.xml
          adt -package \
            -target apk-captive-runtime \
            -arch ${{ matrix.architecture }} \
            -storetype PKCS12 \
            -keystore aqwpocket_keystore.p12 \
            -storepass password \
            \
            AQWMod-${{ needs.prepare.outputs.build_date }}-${{ matrix.architecture }}${{ matrix.suffix }}.apk \
            loader/Mobile-app.xml \
            -C loader \
              Mobile.swf \
              assets \
              icons/icon-36x36.png \
              icons/icon-48x48.png \
              icons/icon-72x72.png \
              icons/icon-96x96.png \
              icons/icon-144x144.png \
              icons/icon-192x192.png \
              gamefiles/game.swf \
              gamefiles/world-map.swf \
              gamefiles/book-of-lore.swf \
              gamefiles/character-select.swf

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.architecture }}${{ matrix.suffix }}
          path: "*.apk"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - architecture: "x64"
            render-mode: "auto"
            suffix: "-windows-x64"
          - architecture: "x64"
            render-mode: "direct"
            suffix: "-windows-x64-direct"
          - architecture: "x64"
            render-mode: "gpu"
            suffix: "-windows-x64-gpu"
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-patched
          path: .

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Build Windows
        run: |
          adt -certificate -cn "AQWPocket" 2048-RSA aqwpocket_keystore.p12 password
          (Get-Content loader/Desktop-app.xml) -replace '<renderMode>.*</renderMode>', '<renderMode>${{ matrix.render-mode }}</renderMode>' | Set-Content loader/Desktop-app.xml
          adt -package -storetype PKCS12 -keystore aqwpocket_keystore.p12 -storepass password -target bundle -arch ${{ matrix.architecture }} AQWMod-${{ needs.prepare.outputs.build_date }}${{ matrix.suffix }} loader/Desktop-app.xml -extdir loader/libs -C loader Desktop.swf assets icons/icon-16x16.png icons/icon-32x32.png icons/icon-36x36.png icons/icon-48x48.png icons/icon-72x72.png icons/icon-96x96.png icons/icon-128x128.png icons/icon-144x144.png icons/icon-192x192.png gamefiles/game.swf gamefiles/world-map.swf gamefiles/book-of-lore.swf gamefiles/character-select.swf

      - name: Zip
        run: Compress-Archive -Path "AQWMod-${{ needs.prepare.outputs.build_date }}${{ matrix.suffix }}" -DestinationPath "AQWMod-${{ needs.prepare.outputs.build_date }}${{ matrix.suffix }}.zip"

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: windows${{ matrix.suffix }}
          path: "AQWMod-*.zip"


  build-macos:
    needs: prepare
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - architecture: "x64"
            render-mode: "auto"
            suffix: "-macos-x64"
          - architecture: "x64"
            render-mode: "direct"
            suffix: "-macos-x64-direct"
          - architecture: "x64"
            render-mode: "gpu"
            suffix: "-macos-x64-gpu"
          - architecture: "armv8"
            render-mode: "auto"
            suffix: "-macos-armv8"
          - architecture: "armv8"
            render-mode: "direct"
            suffix: "-macos-armv8-direct"
          - architecture: "armv8"
            render-mode: "gpu"
            suffix: "-macos-armv8-gpu"
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-patched
          path: .

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Build macOS
        run: |
          adt -certificate -cn "AQWPocket" 2048-RSA aqwpocket_keystore.p12 password
          sed -i '' "s|<renderMode>.*</renderMode>|<renderMode>${{ matrix.render-mode }}</renderMode>|" loader/Desktop-app.xml
          adt -package \
            -storetype PKCS12 \
            -keystore aqwpocket_keystore.p12 \
            -storepass password \
            -target bundle \
            -arch ${{ matrix.architecture }} \
            AQWMod-${{ needs.prepare.outputs.build_date }}${{ matrix.suffix }} \
            loader/Desktop-app.xml \
            -extdir loader/libs \
            -C loader \
              Desktop.swf \
              assets \
              icons/icon-16x16.png \
              icons/icon-32x32.png \
              icons/icon-36x36.png \
              icons/icon-48x48.png \
              icons/icon-72x72.png \
              icons/icon-96x96.png \
              icons/icon-128x128.png \
              icons/icon-144x144.png \
              icons/icon-192x192.png \
              gamefiles/game.swf \
              gamefiles/world-map.swf \
              gamefiles/book-of-lore.swf \
              gamefiles/character-select.swf

      - name: Zip
        run: zip -r AQWMod-${{ needs.prepare.outputs.build_date }}${{ matrix.suffix }}.zip AQWMod-${{ needs.prepare.outputs.build_date }}${{ matrix.suffix }}.app/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos${{ matrix.suffix }}
          path: "AQWMod-${{ needs.prepare.outputs.build_date }}${{ matrix.suffix }}.zip"

  publish:
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.upstream_version }}-mod"
          name: "AQW Mobile Mod ${{ inputs.upstream_version }}"
          body: |
            ## Modded AQW Mobile Build ${{ inputs.upstream_version }}

            ### 📱 Android Downloads:
            * **armv8-gpu (Recommended)**: `AQWMod-*-armv8-gpu.apk`
              → Full 60 FPS hardware acceleration. Best performance for AutoCombat, Auto Leveling, and UI.
            * **armv8-direct (Alternative)**: `AQWMod-*-armv8-direct.apk`
              → Direct Stage3D render mode. Use if GPU mode has graphical artifacts on your device.
            * **armv8 (Default Auto)**: `AQWMod-*-armv8.apk`
              → Standard auto mode.
            * **armv7 (32-bit legacy)**: `AQWMod-*-armv7-gpu.apk` / `armv7-direct` / `armv7`

            ### 💻 Desktop Downloads:
            * **Windows (x64)**: `AQWMod-*-windows-x64-gpu.zip` / `-direct` / `.zip`
            * **macOS (Apple Silicon & Intel)**: `AQWMod-*-macos-armv8-gpu.zip` / `macos-x64`

            ### 🚀 Features Included:
            * **Smart AutoCombat & Class Rotations**: Built-in rotations for all classes via `AdvancedSkills.json`.
            * **Auto Leveling (1-100)**: Automated XP and medal farming in Shadowbattleon.
            * **Offline Quest Database**: Complete `QuestData.json` offline quest metadata.
            * **Custom Scripting Engine**: HScript + command automation.
          files: |
            *.apk
            *.zip
